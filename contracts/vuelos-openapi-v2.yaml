openapi: 3.0.3
info:
  title: API de Vuelos — GDS Flight Core (Booking Prototipo RDA2)
  version: 2.0.0
  license:
    name: Uso académico — Integración de Sistemas EPN
  contact:
    name: Alejandro Sebastián Flores Lugmaña
    email: alejandro.floreslu@outlook.com
  description: |
    # Contrato Oficial de Integración — Vertical de Vuelos (RDA2)

    > **Sistema Proveedor:** Aerolíneas / e-commerce de vuelos de cada equipo (ej. *EcoAirlines*), detrás de su propio gateway.
    > **Sistema Consumidor / Agregador Central:** Booking Prototipo (Marketplace multimodal).
    > **Asignatura:** Integración de Sistemas — 6to Semestre (Reto 2: RDA2).
    > **Estándar:** OpenAPI 3.0.3 · REST HATEOAS · RFC 7807 Problem Details · CloudEvents v1.0 · gRPC (stock).
    > **Documento:** `contracts/vuelos-openapi-v2.yaml` — evolución del contrato v1.5 (`contracts/vuelos-openapi.yaml`, que sigue vigente en `/api/v1`).

    ---

    ## 1. Propósito y alcance
    Este contrato es la **fachada pública** que toda aerolínea debe exponer para que Booking Prototipo pueda buscar,
    bloquear, reservar, emitir, gestionar postventa y hacer check-in de vuelos **sin conocer su arquitectura interna**.

    * Es **el mismo contrato para todos los equipos de vuelos**: Booking integra cualquier aerolínea de la misma forma.
    * Cómo cada equipo lo implementa por dentro (MS de gestión, ESB, orquestador, SOAP, gRPC interno, GraphQL para su
      propia web) es libre, siempre que **hacia afuera** responda exactamente lo que aquí se define.
    * **Fuera de alcance:** cobro con tarjeta, 3DS, facturación y gestión de cuentas de cliente. Ver §4 (pagos).

    ## 2. Mapa de microservicios del proveedor
    Booking **no** llama a la GraphQL de la aerolínea ni a sus microservicios de gestión (MS.G). Entra por **una sola URL
    base** (gateway / reverse proxy de la aerolínea) que enruta por prefijo hacia sus 4 microservicios de respuesta:

    | Endpoints del contrato | Microservicio de respuesta | Cadena interna sugerida (ESB) |
    |---|---|---|
    | `search`, `seatmap`, `flights/{n}/status`, `operaciones/*`, `health`, `eventos`, `promociones/contrato` | **MS.Vuelos** (búsqueda · estado · admin) | Enrutador → Schedule / Offers / FlightStatus |
    | `offers/hold*`, `bookings`, `bookings/{id}`, `tickets*`, `seats`, `check-in`, `boarding-passes` | **MS.Reservas** | Orquestador (Saga) → Customers → Offers → Bookings → CheckIn |
    | `baggage*`, `date-change*`, `cancellation-quote`, `cancel` | **MS.Postventa** | Orquestador (Saga) → Bookings → PostSale (SOAP) → Offers |
    | `webhooks*` | **MS.Clientes** (perfil · webhooks) | Enrutador → Webhooks |

    Cada operación declara su microservicio en la extensión `x-microservice`.

    ## 3. Convención de nombres
    * **Dominio de vuelos** (búsqueda, reservas, boletos, postventa, operaciones): inglés `camelCase`, idéntico a v1
      para no romper implementaciones existentes.
    * **Endpoints transversales del ecosistema** (`health`, `eventos`, `promociones/contrato`) y el objeto de error
      `ProblemDetails`: mismos campos que el resto de verticales (`snake_case`, igual que autos v2), para que Booking
      use **un solo parser** en el Panel de Administración.

    ## 4. Pagos — cobra Booking, la aerolínea recibe la referencia
    En toda venta originada en Booking:
    1. Booking cobra al cliente con su propia pasarela y obtiene un `paymentReference`.
    2. Booking envía ese `paymentReference` (y opcionalmente el monto) en `POST /vuelos/bookings`, `baggage`, `seats`
       o `date-change`.
    3. La aerolínea **NO vuelve a cobrar**: su saga interna salta el paso de pago y solo valida la referencia
       (`PAYMENT_REFERENCE_INVALID`, `AMOUNT_MISMATCH`).
    4. En cancelaciones la aerolínea **calcula** el reembolso (`refund.amount`); **Booking lo ejecuta** al cliente y
       concilia con la aerolínea.

    ## 5. Seguridad (dos capas)
    | Capa | Quién valida | Qué |
    |---|---|---|
    | Usuario final → Booking | **API Gateway de Booking** | JWT del usuario, CORS, rate limiting |
    | Booking → Aerolínea | **Gateway / MS de respuesta de la aerolínea** | Token de servicio OAuth2 `client_credentials` emitido por el `dev-auth` de la aerolínea (`PartnerOAuth2`) |

    * Booking identifica al usuario final reenviando `X-User-Id` (y `X-User-Roles` cuando aplique). La aerolínea
      **confía** en esos encabezados solo si vienen con un token de partner válido.
    * Endpoints de operaciones (`operaciones/*`, `PATCH flights/{n}/status`) exigen el scope `flights:ops` o `flights:admin`.
    * Endpoints públicos (sin token): `search`, `seatmap`, `GET flights/{n}/status`, `health`.

    ## 6. Trazabilidad — `X-Correlation-Id`
    | Encabezado | Identifica | Lo genera |
    |---|---|---|
    | `X-Correlation-Id` | **Todo el proceso de negocio** (ej. la compra de un combo completo) | El gateway de Booking, si no viene del cliente |
    | `X-Request-Id` | Una sola llamada HTTP (un salto) | Cada servicio |
    | `Idempotency-Key` | Una operación, para que un reintento no la duplique | El cliente que inicia la operación |

    **Reglas obligatorias:**
    1. El `X-Correlation-Id` se genera **una sola vez** y se **propaga sin modificarse** por todas las capas.
    2. Toda respuesta lo devuelve en el encabezado `X-Correlation-Id` y todo error en `ProblemDetails.correlation_id`.
    3. Propagación por protocolo:
       * **HTTP/REST:** encabezado `X-Correlation-Id`.
       * **gRPC:** metadata `x-correlation-id`.
       * **SOAP (ej. MS.G.PostSale):** `<soap:Header><corr:CorrelationId>corr-123</corr:CorrelationId></soap:Header>`.
       * **RabbitMQ:** propiedad AMQP `correlation_id` + atributo `correlationid` del CloudEvent.
       * **Kafka:** header `correlationid` + atributo del CloudEvent.
    4. Cada servicio registra cada paso con `correlation_id`, `request_id`, `service`, `operation`, `status`, `latency_ms`,
       `timestamp` (en Booking: tabla `api_request_logs`). Reconstruir el proceso es:
       `SELECT * FROM api_request_logs WHERE correlation_id = 'corr-123' ORDER BY timestamp;`

    ## 7. Comunicación entre microservicios
    | Canal | Uso | En vuelos |
    |---|---|---|
    | **REST** (síncrono, este contrato) | Comandos y consultas con respuesta inmediata; **validaciones** (400/409/422) | search, hold, bookings, tickets, postventa, check-in |
    | **gRPC** (HTTP/2, puerto 50051) | Sincronización de stock de alta frecuencia hacia Booking | La aerolínea empuja asientos libres por vuelo y cabina (§9) |
    | **Bus de eventos** (asíncrono) | Notificar **hechos ya ocurridos** sin acoplarse | CloudEvents vía webhooks a Booking y RabbitMQ/Kafka (§8) |

    ### 7.1. Saga de combos (Booking orquesta)
    Ejemplo: paquete Vuelo + Auto + Hotel, todo con el mismo `X-Correlation-Id`:
    ```
    1. POST /vuelos/offers/hold            (vuelo)    → compensación: DELETE /vuelos/offers/hold/{holdId}
    2. POST /autos/orders/create           (auto)     → compensación: POST /autos/orders/{id}/cancel
    3. POST /alojamientos/...              (hotel)    → compensación: cancelar hotel
    4. Booking cobra                        (pagos)    → compensación: reembolso
    5. POST /vuelos/bookings  (+ paymentReference)    → compensación: POST /vuelos/bookings/{id}/cancel
    6. POST /vuelos/bookings/{id}/tickets  (emisión)
    ```
    Si un paso falla, Booking ejecuta las compensaciones en **orden inverso (LIFO)**. Cada llamada tiene un **timeout de
    5 s** con circuit breaker; los reintentos reutilizan la **misma** `Idempotency-Key`.

    ## 8. Eventos (CloudEvents v1.0)
    Un evento es un **hecho que ya ocurrió**; no es una validación (las validaciones son síncronas por REST).
    * `type` = `ec.edu.epn.booking.vuelos.<evento>` · `source` = `/aerolineas/{codigo}/vuelos` · extensión `correlationid`.
    * **Entrega a Booking:** webhooks (`POST /vuelos/webhooks`), firmados con HMAC-SHA256 (`X-Webhook-Signature`).
    * **Bus interno opcional del ecosistema:** RabbitMQ exchange `booking.events` (routing key `vuelos.<evento>`) y
      Kafka topic `topic-ordenes-b2b` (key = `bookingId`).
    * **Feed de respaldo (outbox):** `GET /vuelos/eventos`.

    **Eventos que PUBLICA la aerolínea:**
    | Evento | Lo consume | Para qué |
    |---|---|---|
    | `hold.created` / `hold.expired` | Booking | Carrito: avisar al usuario y limpiar el hold vencido |
    | `booking.confirmed` / `booking.failed` | Booking (Mis Reservas, admin, notificaciones) | Estado de la reserva |
    | `booking.ticket_issued` / `booking.ticket_failed` | **Facturación**, notificaciones | Emitir factura y enviar e-ticket |
    | `booking.changed` / `booking.baggage_added` / `booking.seat_changed` | Facturación, notificaciones | Cobro de diferencias, aviso |
    | `booking.cancelled` | Facturación, Booking (Saga) | Nota de crédito, reembolso, compensación de combos |
    | `booking.checked_in` | Notificaciones | Enviar pase de abordar |
    | `flight.status_changed` | **Autos**, **Alojamientos**, notificaciones | Mover hora de retiro del auto, check-in tardío de hotel |

    **Eventos que CONSUME la aerolínea (publicados por Booking):**
    | Evento | Acción de la aerolínea |
    |---|---|
    | `ec.edu.epn.booking.pagos.payment.confirmed` | Emitir boletos de la reserva asociada |
    | `ec.edu.epn.booking.pagos.payment.failed` | Liberar el hold y marcar la reserva `FAILED` |
    | `ec.edu.epn.booking.paquetes.package.cancelled` | Compensación: cancelar la parte de vuelo del combo |

    ## 9. Sincronización de stock por gRPC
    * **Endpoint de ingesta (Booking):** `grpc://booking.epn.edu.ec:50051` (local `localhost:50051`), HTTP/2.
    * **Lo dispara:** el dueño del inventario de asientos de la aerolínea (ej. MS.G.Offers) en cada hold, liberación,
      venta, cancelación o cambio.
    * **Contrato Protobuf (`src/proto/inventory.proto`, compartido con autos):**
      ```protobuf
      syntax = "proto3";
      package inventory;

      service InventoryStockService {
        rpc PushStockUpdate (StockUpdateMessage) returns (StockUpdateAck);
        rpc StreamInventoryChanges (stream StockChangeEvent) returns (StreamSummary);
      }

      message StockUpdateMessage {
        string service_id = 1;      // "vuelos" o código del nodo (ej. "NODE_VUE_ECOAIRLINES")
        string item_id = 2;         // número de vuelo + cabina, ej. "AV1632-ECONOMY"
        string date = 3;            // fecha del vuelo YYYY-MM-DD
        string time_slot = 4;       // hora de salida local HH:mm
        int32 available_units = 5;  // asientos libres (AVAILABLE) en esa cabina
        int64 timestamp = 6;        // epoch ms
      }
      message StockUpdateAck { bool success = 1; string message = 2; int64 processed_at = 3; }
      message StockChangeEvent {
        string event_id = 1; string service_id = 2; string item_id = 3;
        string date = 4; string time_slot = 5;
        int32 delta = 6;            // -N al bloquear/vender, +N al liberar/cancelar
        int64 timestamp = 7;
      }
      message StreamSummary { int32 total_events_processed = 1; bool is_synchronized = 2; string last_sync_hash = 3; }
      ```
    * El `X-Correlation-Id` viaja en la metadata gRPC `x-correlation-id`.

    ## 10. Máquinas de estado
    **Asiento (`SeatStatus`):** `AVAILABLE → HELD → BOOKED → TICKETED → CHECKED_IN → BOARDED`
    (un hold vencido o liberado devuelve `HELD → AVAILABLE`; una cancelación devuelve `BOOKED/TICKETED → AVAILABLE`).

    **Hold:** `HELD → CONSUMED` (se convirtió en reserva) · `HELD → RELEASED` (liberado) · `HELD → EXPIRED` (venció el TTL,
    15 min por defecto). Un hold vencido responde **410** `HOLD_EXPIRED`.

    **Reserva:** `PENDING → PENDING_PAYMENT → TICKET_ISSUING → CONFIRMED`, con `FAILED`, `CHANGE_PENDING`,
    `CANCELLATION_PENDING` y `CANCELLED`.

    **Vuelo:** `SCHEDULED → BOARDING → DEPARTED → ARRIVED`, con `DELAYED`, `CANCELLED` y `DIVERTED`.

    **Check-in:** abre **48 h** antes de la salida y cierra a la hora de salida.

    ## 11. Errores (RFC 7807)
    Todas las respuestas de error usan `application/problem+json`:
    ```json
    {
      "type": "https://api.booking.local/errors/hold-expired",
      "title": "Hold vencido",
      "status": 410,
      "detail": "El bloqueo de asientos venció a las 10:15 UTC. Realice una nueva búsqueda.",
      "instance": "/api/v2/vuelos/bookings",
      "code": "HOLD_EXPIRED",
      "correlation_id": "corr-vuelos-7f3a9c",
      "timestamp": "2026-10-23T10:16:02Z"
    }
    ```

    ## 12. Disponibilidad y versionado
    * `/api/v1` (contrato 1.5) y `/api/v2` (este contrato) conviven en el mismo despliegue.
    * Booking aplica **timeout de 5 s** y circuit breaker por proveedor. Si el proveedor corre en un plan que "duerme"
      (ej. Render free, ~30-50 s de arranque en frío), `GET /vuelos/health` reportará `DOWN`/`DEGRADED` mientras despierta.

    ## 13. Cambios respecto a v1.5
    | Tipo | Cambio |
    |---|---|
    | Ruta | `https://api.booking-hub.com/flights/v1/<ruta>` → `/api/v2/vuelos/<ruta>` |
    | Nuevo | `GET /vuelos/health`, `GET /vuelos/eventos`, `GET/PUT /vuelos/promociones/contrato` |
    | Nuevo | `GET /vuelos/operaciones/vuelos`, `PATCH /vuelos/flights/{flightNumber}/status` |
    | Nuevo | `POST /vuelos/bookings/{bookingId}/tickets` (ya implementado, faltaba en el contrato) |
    | Nuevo | `PUT /vuelos/bookings/{bookingId}/seats` (cambio de asiento) |
    | Ampliado | `ProblemDetails` (+`instance`, `correlation_id`, `timestamp`, nuevos `code`) |
    | Ampliado | Respuesta de `cancel` (reembolso + restauración de inventario), `_links` HATEOAS, `salesChannel`, `ttlMinutes` del hold, `status` por asiento en el seatmap |
    | Ampliado | Webhooks entregan CloudEvents firmados; nuevos tipos de evento |
    | Nuevo | Encabezados `X-Correlation-Id`, `X-Request-Id`, `X-User-Id` en todo el contrato |
servers:
  - url: /api/v2
    description: Ruta relativa canónica v2 (detrás del gateway)
  - url: https://rda1-backend-integracion-sistemas.onrender.com/api/v2
    description: Implementación de referencia desplegada (Render)
  - url: https://{aerolineaHost}/api/v2
    description: Gateway público de cada aerolínea (una sola URL base que enruta a sus microservicios de respuesta)
    variables:
      aerolineaHost:
        default: mi-aerolinea.onrender.com
        description: Host público del gateway de la aerolínea
  - url: http://localhost:3000/api/v2
    description: Desarrollo local (NestJS)
  - url: https://rda1-backend-integracion-sistemas.onrender.com/api/v1
    description: Legacy v1.5 (compatibilidad hacia atrás)

security:
  - PartnerOAuth2: []

tags:
  - name: MS.Vuelos — Búsqueda y Catálogo
    description: Búsqueda multidestino, mapa de asientos y estado público de vuelos.
  - name: MS.Vuelos — Operaciones
    description: Panel de ocupación por vuelo y cabina y cambio de estado operativo (roles OPS / ADMIN).
  - name: MS.Vuelos — Promociones B2B
    description: Acuerdo comercial de promociones y combos con Booking Prototipo.
  - name: MS.Vuelos — Telemetría
    description: Salud del nodo (semáforo del Panel 1) y feed outbox de eventos.
  - name: MS.Reservas — Bloqueo de Cupos (Hold)
    description: Retención temporal de asientos con precio congelado y TTL.
  - name: MS.Reservas — Reservas y Emisión
    description: Creación de reservas con paymentReference, consulta y emisión de boletos.
  - name: MS.Reservas — Asientos, Check-in y Boarding Pass
    description: Cambio de asiento, check-in en línea y pases de abordar.
  - name: MS.Postventa
    description: Maletas extra, cambio de fecha, cotización y cancelación con compensación Saga.
  - name: MS.Clientes — Webhooks
    description: Suscripciones para recibir eventos CloudEvents firmados.

x-tagGroups:
  - name: MS.Vuelos
    tags:
      - MS.Vuelos — Búsqueda y Catálogo
      - MS.Vuelos — Operaciones
      - MS.Vuelos — Promociones B2B
      - MS.Vuelos — Telemetría
  - name: MS.Reservas
    tags:
      - MS.Reservas — Bloqueo de Cupos (Hold)
      - MS.Reservas — Reservas y Emisión
      - MS.Reservas — Asientos, Check-in y Boarding Pass
  - name: MS.Postventa
    tags:
      - MS.Postventa
  - name: MS.Clientes
    tags:
      - MS.Clientes — Webhooks
paths:
  # ===========================================================================
  # MS.VUELOS — TELEMETRÍA
  # ===========================================================================
  /vuelos/health:
    get:
      tags: [MS.Vuelos — Telemetría]
      operationId: getHealth
      x-microservice: MS.Vuelos
      summary: Salud y telemetría del nodo de vuelos (semáforo 🟢/🔴 del Panel 1)
      description: |
        Consumido por el Monitor de Nodos de Booking. Responde **200** si el nodo está `HEALTHY` o `DEGRADED` y **503**
        si está `DOWN`. Debe responder en menos de 1 s y no requiere token. Usa los mismos campos que el resto de verticales.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Nodo operativo (HEALTHY o DEGRADED)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VuelosHealthResponse'
        '503':
          description: Nodo caído (DOWN) — mismo cuerpo de salud con `status = DOWN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VuelosHealthResponse'

  /vuelos/eventos:
    get:
      tags: [MS.Vuelos — Telemetría]
      operationId: listOutboxEvents
      x-microservice: MS.Vuelos
      summary: Feed outbox de eventos CloudEvents (respaldo de los webhooks)
      description: |
        Expone en orden cronológico los eventos registrados por el patrón Transactional Outbox. Booking lo usa para
        reconciliar eventos que no llegaron por webhook. Paginación por cursor con `after` (id del último evento leído).
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          required: false
          description: Id del último evento ya procesado; devuelve los posteriores.
          schema:
            type: string
          example: evt-vue-000120
        - name: type
          in: query
          required: false
          description: Filtra por tipo corto de evento (ej. `booking.confirmed`).
          schema:
            $ref: '#/components/schemas/VuelosEventName'
      responses:
        '200':
          description: Página de eventos
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VuelosEventosResponse'
        '401':
          $ref: '#/components/responses/Problem401'

  # ===========================================================================
  # MS.VUELOS — PROMOCIONES B2B
  # ===========================================================================
  /vuelos/promociones/contrato:
    get:
      tags: [MS.Vuelos — Promociones B2B]
      operationId: getPromotionAgreement
      x-microservice: MS.Vuelos
      summary: Consultar el acuerdo B2B de promociones y combos
      description: Devuelve si la aerolínea acepta participar en combos y el porcentaje máximo de descuento autorizado.
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Acuerdo vigente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoPromocionesResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
    put:
      tags: [MS.Vuelos — Promociones B2B]
      operationId: putPromotionAgreement
      x-microservice: MS.Vuelos
      summary: Formalizar o actualizar el acuerdo B2B de promociones
      description: |
        Responde una sola vez el cuestionario de la cátedra:
        1. ¿Acepta participar en promociones y combos? (`permite_promociones`)
        2. ¿Cuál es el porcentaje máximo de descuento? (`porcentaje_descuento_maximo`)
        3. ¿En qué rutas, destinos y cabinas aplica?
      security:
        - PartnerOAuth2: [flights:admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoPromocionesRequest'
      responses:
        '200':
          description: Acuerdo registrado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Acuerdo B2B de promociones de vuelos actualizado exitosamente.
                  contrato:
                    $ref: '#/components/schemas/ContratoPromocionesResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'

  # ===========================================================================
  # MS.VUELOS — BÚSQUEDA Y CATÁLOGO
  # ===========================================================================
  /vuelos/search:
    post:
      tags: [MS.Vuelos — Búsqueda y Catálogo]
      operationId: searchFlights
      x-microservice: MS.Vuelos
      summary: Búsqueda de vuelos (solo ida, ida y vuelta o multidestino)
      description: |
        Devuelve ofertas con precios por tipo de pasajero, cabina, reglas tarifarias y equipaje incluido.
        Solo muestra cabinas con `availableSeats > 0`. Límite de peticiones por dispositivo (`X-Device-Fingerprint`) → 429.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DeviceFingerprint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ofertas encontradas
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'

  /vuelos/offers/{offerId}/seatmap:
    get:
      tags: [MS.Vuelos — Búsqueda y Catálogo]
      operationId: getSeatMap
      x-microservice: MS.Vuelos
      summary: Mapa de asientos de un segmento con el estado de cada asiento
      security: []
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - name: segmentId
          in: query
          required: true
          schema:
            type: string
          example: SEG-AV1632-20261120
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Mapa de asientos (sin precios)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapResponse'
        '404':
          $ref: '#/components/responses/Problem404'
        '410':
          $ref: '#/components/responses/Problem410'
        '429':
          $ref: '#/components/responses/Problem429'

  /vuelos/flights/{flightNumber}/status:
    get:
      tags: [MS.Vuelos — Búsqueda y Catálogo]
      operationId: getFlightStatus
      x-microservice: MS.Vuelos
      summary: Estado operativo de un vuelo en una fecha
      security: []
      parameters:
        - $ref: '#/components/parameters/FlightNumber'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-20'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado del vuelo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightStatus'
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      tags: [MS.Vuelos — Operaciones]
      operationId: updateFlightStatus
      x-microservice: MS.Vuelos
      summary: Cambiar el estado operativo de un vuelo (rol OPS / ADMIN)
      description: |
        Registra demoras, cambios de puerta, cancelaciones o desvíos. Valida la transición de estados
        (ej. no se puede pasar de `ARRIVED` a `BOARDING` → 409 `INVALID_STATUS_TRANSITION`).
        Emite el evento `flight.status_changed`, que consumen Booking, Autos y Alojamientos.
        Si el nuevo estado es `CANCELLED`, las reservas afectadas pasan a gestión de reembolso.
      security:
        - PartnerOAuth2: [flights:ops]
      parameters:
        - $ref: '#/components/parameters/FlightNumber'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightStatusUpdateRequest'
      responses:
        '200':
          description: Estado actualizado y evento emitido
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightStatusUpdateResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'

  # ===========================================================================
  # MS.VUELOS — OPERACIONES
  # ===========================================================================
  /vuelos/operaciones/vuelos:
    get:
      tags: [MS.Vuelos — Operaciones]
      operationId: listFlightOperations
      x-microservice: MS.Vuelos
      summary: Panel de ocupación por vuelo y cabina (equivalente al panel de flota de autos)
      description: |
        Devuelve, para cada vuelo de la fecha, los asientos por estado (`AVAILABLE`, `HELD`, `BOOKED`, `TICKETED`,
        `CHECKED_IN`, `BOARDED`), el factor de ocupación, los holds activos con su próximo vencimiento y alertas
        operativas (sobreventa, demora, check-in abierto).
      security:
        - PartnerOAuth2: [flights:ops]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-20'
        - name: origin
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Z]{3}$
          example: UIO
        - name: destination
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Z]{3}$
          example: GYE
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FlightOperationalStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ocupación de los vuelos solicitados
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightOperationsResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'

  # ===========================================================================
  # MS.RESERVAS — HOLD
  # ===========================================================================
  /vuelos/offers/hold:
    post:
      tags: [MS.Reservas — Bloqueo de Cupos (Hold)]
      operationId: createHold
      x-microservice: MS.Reservas
      summary: Bloquear asientos con precio congelado
      description: |
        Retiene inventario de la oferta y congela el precio durante `ttlMinutes` (15 min por defecto, 5–30).
        Los asientos pasan a `HELD`, se emite `hold.created` y se envía `StockChangeEvent` (delta negativo) por gRPC.
        Al vencer, los asientos vuelven a `AVAILABLE` y se emite `hold.expired`.
        **Compensación Saga:** `DELETE /vuelos/offers/hold/{holdId}`.
      security:
        - PartnerOAuth2: [flights:hold]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/DeviceFingerprintOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '201':
          description: Inventario retenido
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResponse'
        '200':
          description: Reintento con la misma `Idempotency-Key` — devuelve el hold original
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '409':
          $ref: '#/components/responses/Problem409'
        '410':
          $ref: '#/components/responses/Problem410'
        '422':
          $ref: '#/components/responses/Problem422'
        '503':
          $ref: '#/components/responses/Problem503'

  /vuelos/offers/hold/{holdId}:
    get:
      tags: [MS.Reservas — Bloqueo de Cupos (Hold)]
      operationId: getHold
      x-microservice: MS.Reservas
      summary: Consultar el estado y el tiempo restante de un hold
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado del hold
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldStatusResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
    delete:
      tags: [MS.Reservas — Bloqueo de Cupos (Hold)]
      operationId: releaseHold
      x-microservice: MS.Reservas
      summary: Liberar un hold (compensación Saga)
      description: |
        Devuelve los asientos a `AVAILABLE` y envía `StockChangeEvent` (delta positivo).
        Es idempotente: liberar un hold ya liberado o vencido responde 204.
        Un hold `CONSUMED` (ya convertido en reserva) responde 409 `HOLD_ALREADY_CONSUMED`; en ese caso se compensa con `cancel`.
      security:
        - PartnerOAuth2: [flights:hold]
      parameters:
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Hold liberado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'

  # ===========================================================================
  # MS.RESERVAS — RESERVAS Y EMISIÓN
  # ===========================================================================
  /vuelos/bookings:
    get:
      tags: [MS.Reservas — Reservas y Emisión]
      operationId: listBookings
      x-microservice: MS.Reservas
      summary: Listar reservas del usuario (paginado por cursor)
      description: El dueño se toma de `X-User-Id` (reenviado por Booking) o del `sub` del token. Nunca del body.
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/DeviceFingerprintOptional'
        - name: pnr
          in: query
          schema:
            type: string
          example: XK7P2Q
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista resumida
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          $ref: '#/components/responses/Problem401'
    post:
      tags: [MS.Reservas — Reservas y Emisión]
      operationId: createBooking
      x-microservice: MS.Reservas
      summary: Crear reserva a partir de un hold (con paymentReference de Booking)
      description: |
        Convierte el hold en reserva (`HELD → CONSUMED`), registra pasajeros y genera el PNR.
        **Pagos:** el cobro lo hizo Booking; aquí solo llega `payment.paymentReference`. La aerolínea **no cobra** y solo valida
        la referencia (`PAYMENT_REFERENCE_INVALID`, `AMOUNT_MISMATCH`).
        Emisión: si es inmediata responde **201** (`CONFIRMED`); si continúa en segundo plano responde **202**
        (`TICKET_ISSUING`) y el resultado llega por el evento `booking.ticket_issued` / `booking.ticket_failed`.
        Emite `booking.confirmed`. **Compensación Saga:** `POST /vuelos/bookings/{bookingId}/cancel`.
      security:
        - PartnerOAuth2: [flights:book]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/DeviceFingerprintOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Reserva creada y boletos emitidos
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '202':
          description: Reserva creada; la emisión continúa de forma asíncrona
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '200':
          description: Reintento con la misma `Idempotency-Key` — devuelve la reserva original
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '409':
          $ref: '#/components/responses/Problem409'
        '410':
          $ref: '#/components/responses/Problem410'
        '422':
          $ref: '#/components/responses/Problem422'
        '503':
          $ref: '#/components/responses/Problem503'

  /vuelos/bookings/{bookingId}:
    get:
      tags: [MS.Reservas — Reservas y Emisión]
      operationId: getBooking
      x-microservice: MS.Reservas
      summary: Detalle completo de una reserva
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/DeviceFingerprintOptional'
      responses:
        '200':
          description: Itinerarios, pasajeros, boletos, historial y enlaces HATEOAS
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'

  /vuelos/bookings/{bookingId}/tickets:
    post:
      tags: [MS.Reservas — Reservas y Emisión]
      operationId: issueTickets
      x-microservice: MS.Reservas
      summary: Emitir los boletos de una reserva
      description: |
        Emite un boleto por pasajero con un cupón por segmento. Asientos `BOOKED → TICKETED`.
        **Idempotente por construcción:** si ya estaban emitidos responde 200 con `issued: 0`, por eso
        `Idempotency-Key` es opcional. Emite `booking.ticket_issued` (lo consume Facturación).
        Booking la invoca tras confirmar el pago, o la aerolínea la ejecuta al consumir `payment.confirmed`.
      security:
        - PartnerOAuth2: [flights:book]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/DeviceFingerprintOptional'
      responses:
        '200':
          description: Boletos emitidos (o ya emitidos)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketIssuanceResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
    get:
      tags: [MS.Reservas — Reservas y Emisión]
      operationId: listTickets
      x-microservice: MS.Reservas
      summary: Consultar los boletos de una reserva
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Boletos de la reserva
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'

  /vuelos/bookings/{bookingId}/tickets/{ticketId}:
    get:
      tags: [MS.Reservas — Reservas y Emisión]
      operationId: getTicket
      x-microservice: MS.Reservas
      summary: Consultar un boleto
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - name: ticketId
          in: path
          required: true
          description: Identificador de negocio del boleto (no es UUID).
          schema:
            type: string
            pattern: ^[A-Za-z0-9-]+$
          example: TKT-A1B2C3D4E5F6
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detalle del boleto
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'

  # ===========================================================================
  # MS.RESERVAS — ASIENTOS, CHECK-IN Y BOARDING PASS
  # ===========================================================================
  /vuelos/bookings/{bookingId}/seats:
    put:
      tags: [MS.Reservas — Asientos, Check-in y Boarding Pass]
      operationId: changeSeats
      x-microservice: MS.Reservas
      summary: Asignar o cambiar asientos de los pasajeros
      description: |
        Cambia asientos dentro de la misma cabina. El asiento anterior vuelve a `AVAILABLE` y el nuevo pasa al estado
        del pasajero (`BOOKED` o `TICKETED`). Si el asiento tiene costo, Booking cobra antes y envía `payment`.
        No permitido después del check-in del segmento (409 `CUTOFF_PASSED`), para infantes sin asiento
        (422 `INFANT_SEAT_NOT_ALLOWED`) ni en otra cabina (422 `SEAT_CABIN_MISMATCH`).
        Emite `booking.seat_changed`. Es una operación atómica: o se cambian todos los asientos o ninguno.
      security:
        - PartnerOAuth2: [flights:book]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatChangeRequest'
      responses:
        '200':
          description: Asientos asignados
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatChangeResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'

  /vuelos/bookings/{bookingId}/check-in:
    post:
      tags: [MS.Reservas — Asientos, Check-in y Boarding Pass]
      operationId: checkIn
      x-microservice: MS.Reservas
      summary: Check-in en línea de la reserva
      description: |
        Disponible desde **48 h** antes de la salida hasta la salida. Requiere boletos emitidos.
        Asientos `TICKETED → CHECKED_IN`. Un segundo intento responde 409 (no se duplica), por eso `Idempotency-Key` es opcional.
        Emite `booking.checked_in`.
      security:
        - PartnerOAuth2: [flights:book]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/DeviceFingerprintOptional'
      responses:
        '200':
          description: Check-in realizado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'

  /vuelos/bookings/{bookingId}/boarding-passes:
    get:
      tags: [MS.Reservas — Asientos, Check-in y Boarding Pass]
      operationId: listBoardingPasses
      x-microservice: MS.Reservas
      summary: Pases de abordar (datos para QR / código de barras)
      security:
        - PartnerOAuth2: [flights:read]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Pases de abordar
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPassListResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'

